[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trialmatch"
version = "0.1.0"
description = "Criterion-level clinical trial eligibility screening with verbatim evidence from the patient note"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trialmatch = "trialmatch.cli:main"

[tool.setuptools.packages.find]
include = ["trialmatch*"]

[tool.setuptools.package-data]
trialmatch = ["static/*", "samples/*", "pools/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
